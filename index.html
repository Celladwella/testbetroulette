<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Bet Roulette</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
    }

    #gameFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #bootStatus {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 10;
      transform: translate(-50%, -50%);
      padding: 12px 16px;
      border: 1px solid rgba(255, 211, 77, 0.55);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.84);
      color: #ffd34d;
      font: 700 14px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
    }

    #bootStatus.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <iframe id="gameFrame" title="Test Bet Roulette" allow="fullscreen; autoplay" allowfullscreen></iframe>
  <div id="bootStatus">Loading Test Bet Roulette...</div>

  <script>
    (function(){
      'use strict';

      var GAME_PAGE = 'roulette_v56_debug.html';
      var SAVE_SCRIPT = 'named-game-saves.js';
      var frame = document.getElementById('gameFrame');
      var status = document.getElementById('bootStatus');

      function hideStatus(){
        if(status) status.classList.add('hidden');
      }

      function showStatus(message){
        if(status){
          status.textContent = message;
          status.classList.remove('hidden');
        }
      }

      function injectIntoFrame(){
        try {
          var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
          if(!doc || !doc.body) return false;
          if(doc.getElementById('namedGameSavesInjected')) return true;
          var script = doc.createElement('script');
          script.id = 'namedGameSavesInjected';
          script.src = SAVE_SCRIPT;
          doc.body.appendChild(script);
          return true;
        } catch(err) {
          console.warn('Could not inject named save controls into iframe:', err);
          showStatus('Game loaded. Save buttons may require opening through a local or web server.');
          return false;
        }
      }

      function bootWithFetch(){
        if(!window.fetch) throw new Error('fetch unavailable');
        return fetch(GAME_PAGE, { cache: 'no-store' })
          .then(function(response){
            if(!response.ok) throw new Error('Unable to load ' + GAME_PAGE);
            return response.text();
          })
          .then(function(html){
            if(!/<base\s/i.test(html)){
              html = html.replace(/<head([^>]*)>/i, '<head$1><base href="./">');
            }
            if(html.indexOf(SAVE_SCRIPT) === -1){
              var tag = '\n<script src="' + SAVE_SCRIPT + '"></scr' + 'ipt>\n';
              if(/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, tag + '</body>');
              else html += tag;
            }
            frame.addEventListener('load', hideStatus, { once: true });
            frame.srcdoc = html;
          });
      }

      function bootWithFrame(){
        frame.addEventListener('load', function(){
          injectIntoFrame();
          setTimeout(hideStatus, 700);
        }, { once: true });
        frame.src = GAME_PAGE;
      }

      bootWithFetch().catch(function(err){
        console.warn('Source-document boot failed, falling back to iframe:', err);
        bootWithFrame();
      });
    })();
  </script>
</body>
</html>
